name: Idea or request
description: Something Local Quench should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task or the situation, more than the solution. What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: input
    id: setup
    attributes:
      label: Your setup (optional)
      placeholder: Graphics card, model, model server
